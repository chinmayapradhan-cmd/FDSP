      label: Target branch
      options:
        - test
        - main
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Promotion Summary
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation Evidence
    validations:
      required: true
