---
name: Promotion request
description: Request promotion from dev to test or test to main
title: ""
labels: ["status:needs-review"]
body:
  - type: dropdown
    id: source
    attributes:
      label: Source branch
      options:
        - dev
        - test
    validations:
      required: true

  - type: dropdown
